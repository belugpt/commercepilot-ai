services:
  app:
    build: .
    env_file: .env
    environment:
      COMMERCEPILOT_DB: /data/commercepilot.db
      COMMERCEPILOT_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - merchant-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    profiles: [tunnel]
    network_mode: service:app
    command: ["tunnel", "--url", "http://127.0.0.1:8002", "--no-autoupdate"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  merchant-data:
